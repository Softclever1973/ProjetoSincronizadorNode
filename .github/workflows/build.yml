name: Build, Test & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Tag estável (sem sufixo) vira "Latest" e atualiza todas as lojas: só sai se o commit já estiver na main.
  # Beta (v1.6.0-beta.1) pode sair de qualquer branch (ex.: dev) — vira Pre-release e as lojas não pegam.
  verificar-origem:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório (com histórico, para comparar com a main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag estável só a partir da main
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "Beta ($TAG): pode sair de qualquer branch."
            exit 0
          fi
          git fetch origin main --quiet
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag estável $TAG aponta para um commit da main — ok."
          else
            echo "::error::A tag estável $TAG aponta para um commit que não está na main. Junte o código na main e crie a tag lá, ou use uma tag beta (ex.: $TAG-beta.1)."
            exit 1
          fi

  build:
    needs: verificar-origem
    runs-on: windows-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar version do package.json com a tag
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}" -replace '^v', ''
          npm version $versao --no-git-tag-version --allow-same-version
          Write-Host "package.json version definido para $versao"

      - name: Build server.exe
        run: npm run build:server

      - name: Build client.exe
        run: npm run build:client

      - name: Zipar client
        run: 7z a client.zip src\client node_modules package.json src\client\.env.example

      - name: Zipar server (sem client)
        run: 7z a server.zip src node_modules package.json .env.example "-xr!client"

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/server.exe
            dist/client.exe
            client.zip
            server.zip

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Baixar artefatos do build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Smoke test — server.exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\server.exe" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "server_stdout.txt" `
            -RedirectStandardError  "server_stderr.txt"
          Start-Sleep -Seconds 3
          if (-not $proc.HasExited) { $proc.Kill() }
          $out = (Get-Content "server_stdout.txt" -Raw -ErrorAction SilentlyContinue) +
                 (Get-Content "server_stderr.txt" -Raw -ErrorAction SilentlyContinue)
          if (-not $out.Trim()) {
            Write-Error "server.exe não produziu nenhuma saída — crash no binário"
            exit 1
          }
          Write-Host "server.exe OK"
          Write-Host $out.Substring(0, [Math]::Min(300, $out.Length))

      - name: Smoke test — client.exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\client.exe" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "client_stdout.txt" `
            -RedirectStandardError  "client_stderr.txt"
          Start-Sleep -Seconds 3
          if (-not $proc.HasExited) { $proc.Kill() }
          $out = (Get-Content "client_stdout.txt" -Raw -ErrorAction SilentlyContinue) +
                 (Get-Content "client_stderr.txt" -Raw -ErrorAction SilentlyContinue)
          if (-not $out.Trim()) {
            Write-Error "client.exe não produziu nenhuma saída — crash no binário"
            exit 1
          }
          Write-Host "client.exe OK"
          Write-Host $out.Substring(0, [Math]::Min(300, $out.Length))

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar artefatos aprovados
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Criar release e anexar arquivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Tag com sufixo (v1.6.0-beta.1) = beta de teste interno: sai como Pre-release e não vira "Latest",
          # então o /releases/latest que as lojas consultam continua apontando para a estável.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/server.exe
            dist/client.exe
            client.zip
            server.zip
